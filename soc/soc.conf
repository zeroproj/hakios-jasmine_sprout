# soc/soc.conf: what this SoC repository is: the facts of a Qualcomm SDM660-family chip, whatever phone it is in.
# A phone with this SoC includes configs/sdm660.config from its defconfig. docs/porting/repositories.md has every word.
#
# The chip is the Snapdragon 660 (SDM660) of the Xiaomi Mi A2 (jasmine_sprout) and of the Xiaomi Mi 8 Lite
# (platina): the same "sdm660" family, the same PM660/PM660L PMIC pair, the same Adreno 512, the same
# GICv3, the same 8 Cortex-A53. What differs between the phones of this family is the board, not the chip:
# the panel, the touch controller, the cameras and the regulators. Those belong to the device, not here.

soc sdm660
	title       Qualcomm SDM660 family (Snapdragon 660; "jasmine_sprout", "platina", "wayne")
	vendor      Qualcomm
	cores       8, the biggest is core 7
	gpu         Adreno 512 (chip id 0x05010200)
	maintainer  the HakiOS developers (README.md)
