# devices/jasmine_sprout/device.conf: what this device repository is. tools/hakios-device.py reads it; docs/porting/repositories.md has
# every word, and the device's page (docs/devices/jasmine_sprout.md) is made from it, so that the status is said in one place.
#
# Nothing here has been seen on the phone yet. Every area is "missing" with the reason: that is the truth of this port as it
# stands, and docs/port-notes.md says what each driver needs and where its hardware is. The first area to become "partial" is
# the display, once the boot shim and the loader hand the framebuffer over.

device jasmine_sprout
	title       Xiaomi Mi A2
	vendor      Xiaomi
	soc         sdm660
	defconfig   jasmine_sprout_defconfig
	firmware    pull-firmware.sh
	maintainer  the HakiOS developers (README.md)
	status      display     missing   no boot shim for this chip yet: the framebuffer comes from the bootloader (docs/port-notes.md, the display)
	status      touch       missing   this phone's screen is a Synaptics TCM on I2C1, and no such driver is written
	status      buttons     missing   the driver's SPMI arbiter addresses are the reference phone's, not this chip's
	status      cpu         missing   the clock driver speaks the SC7280's command database; this chip's RPM is different
	status      gpu         missing   the driver is written for the Adreno 642L (A6xx); this chip has an Adreno 512 (A5xx)
	status      storage     missing   this phone has eMMC (SDHC1 at 0x0c0c4000); the only storage driver is UFS
	status      audio       missing   this phone's sound is the PMIC's own codec; no driver for it
	status      battery     missing   the level comes through the audio DSP; no driver for this chip's DSP yet
	status      haptic      missing   the motor is the PMIC's own ERM driver (PM660 USID 1); no driver for it
	status      camera      missing   this phone's sensors are on a CCI with three of them; no driver for them
	status      torch       missing   the flash LED is the PM660L's; no driver for it
	status      wifi        missing   this phone's radio is a WCN3990; the driver is written for the WCN6750
	status      bluetooth   missing   as the Wi-Fi
	status      cellular    missing   this chip's IPC to the modem is the glink transport; the driver speaks the IPCC
	status      network     missing   as the cellular
	status      thermal     missing   the driver reads two blocks at the reference phone's addresses; this chip has one
	status      usb         missing   no driver for this chip's USB controller
	status      sensors     missing   no driver for this phone's sensors
